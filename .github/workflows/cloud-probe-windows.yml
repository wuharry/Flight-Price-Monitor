name: One-off Tigerair Windows headed integration test

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: tigerair-windows-integration-test
  cancel-in-progress: false

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      PROBE_ARCHIVE: 
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Extract credential-free test bundle
        shell: bash
        run: |
          PROBE_ROOT="$(cygpath -u "$RUNNER_TEMP")/flight-probe"
          mkdir -p "$PROBE_ROOT"
          cd "$PROBE_ROOT"
          printf '%s' "$PROBE_ARCHIVE" | base64 -d > probe.tar.gz
          printf '%s\n' 'c23e2356e1ce19dc841e88c54ccd4e8b2d42b19c03f83f6ece5656ad86be8d31  probe.tar.gz' | sha256sum -c -
          tar -xzf probe.tar.gz
          cd flight-cloud-probe
          sha256sum -c SHA256SUMS
          npm install --ignore-scripts --no-audit --no-fund
          node <<'NODE' >> "$GITHUB_ENV"
          const fs = require('node:fs');
          const path = require('node:path');
          const roots = [process.env.ProgramFiles, process.env['ProgramFiles(x86)'], process.env.LOCALAPPDATA].filter(Boolean);
          const executable = roots.map(root => path.join(root,'Google','Chrome','Application','chrome.exe')).find(file => fs.existsSync(file));
          if (!executable) throw new Error('Preinstalled full Google Chrome was not found');
          console.log('PROBE_CHROME='+executable);
          NODE

      - name: Verify headed Chrome offline and search once
        shell: bash
        run: |
          PROBE_ROOT="$(cygpath -u "$RUNNER_TEMP")/flight-probe"
          cd "$PROBE_ROOT/flight-cloud-probe"
          cat > runner.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('node:fs');
          const launch = chromium.launch.bind(chromium);
          const executablePath = process.env.PROBE_CHROME;
          chromium.launch = options => launch({
            ...options,
            executablePath,
            headless: false,
            args: (options.args ?? []).filter(arg => !arg.startsWith('--headless')),
          });
          (async () => {
            const browser = await chromium.launch({args:[],timeout:20000});
            try {
              const page = await browser.newPage();
              await page.setContent('<title>offline-smoke</title><p>ready</p>');
              if (await page.title() !== 'offline-smoke') throw new Error('Browser smoke failed');
              const userAgent = await page.evaluate(() => navigator.userAgent);
              fs.writeFileSync('browser-environment.json', JSON.stringify({platform:'GitHub Actions windows-2025',browserVersion:browser.version(),headless:false,headlessArguments:[],userAgent,offlineSmoke:'PASS'},null,2));
              console.log('OFFLINE_BROWSER_PASS', browser.version(), 'headed Windows Chrome');
            } finally { await browser.close(); }
            require('./probe.cjs');
          })().catch(error => {console.error(error.message);process.exitCode=1;});
          NODE
          cat > bounded.cjs <<'NODE'
          const { spawn } = require('node:child_process');
          const child = spawn(process.execPath,['runner.cjs'],{stdio:'inherit',windowsHide:true});
          const timer = setTimeout(() => {
            console.error('Single-run 150 second limit reached; stopping the test process.');
            child.kill();
          },150000);
          child.once('error',error => {clearTimeout(timer);console.error(error.message);process.exitCode=1;});
          child.once('exit',code => {clearTimeout(timer);process.exitCode=code ?? 1;});
          NODE
          node bounded.cjs

      - name: Preserve result in logs and summary only
        if: always()
        shell: bash
        run: |
          PROBE_ROOT="$(cygpath -u "$RUNNER_TEMP")/flight-probe"
          cd "$PROBE_ROOT/flight-cloud-probe"
          node <<'NODE'
          const fs = require('node:fs');
          if (!fs.existsSync('probe-output/result.json')) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Browser setup failed; no Tigerair quotation was tested.\n');
            process.exit(0);
          }
          const result=JSON.parse(fs.readFileSync('probe-output/result.json','utf8'));
          const browser=JSON.parse(fs.readFileSync('browser-environment.json','utf8'));
          console.log('CLOUD_PROBE_JSON='+Buffer.from(JSON.stringify({browser,result})).toString('base64'));
          const compact={status:result.status,search:result.test,price:result.price??null,error:result.error??null,browser:browser.browserVersion,headless:browser.headless,fareRequests:result.providerDiagnostic?.fareRequests,scheduleEnabled:result.scheduleEnabled,emailEnabled:result.emailEnabled,databaseEnabled:result.databaseEnabled};
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### One-off Tigerair Windows headed integration test\n\n```json\n'+JSON.stringify(compact,null,2)+'\n```\n\nStandard public-repository Windows runner. No artifact upload, cache, mail, database, or schedule.\n');
          NODE
